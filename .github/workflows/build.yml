name: Build

# Artifacts are produced for every push to main, dev and the working branch, so
# there is always something downloadable to test with. The DSP tests gate the
# plugin builds: if the signal processing is wrong there is no point compiling
# three platforms' worth of plugin.
#
# Publishing is layered on top of the same run rather than split into a separate
# workflow: a release must ship the exact binaries that were tested, and the
# simplest way to guarantee that is to publish the artifacts this run produced.
#
#   push to dev   -> pre-release, tagged vX.Y.Z-dev.<run number>
#   push to main  -> release,     tagged vX.Y.Z
#
# The version comes from CMakeLists.txt, which is the single source of truth. A
# main merge whose version already has a release fails loudly rather than
# overwriting it.
on:
  push:
    branches: [main, dev, 'claude/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # Bump this in one place to move to a new JUCE release.
  JUCE_TAG: "8.0.15"

jobs:
  # ---------------------------------------------------------------------------
  # Every platform's standard library, as a fast gate.
  #
  # This exists because two portability bugs in a row got through a Linux-only
  # check: <numbers> is in libstdc++ but not in the macOS runner's libc++, and
  # std::aligned_alloc is in both but not in MSVC, which never implemented C11's
  # aligned_alloc. Both are compile errors that a Linux build cannot see.
  #
  # The DSP core has no JUCE dependency, so each of these configures, compiles and
  # runs the whole suite in about a minute - as against four-plus minutes to reach
  # the same compile error inside a plugin build that first has to configure JUCE.
  # Catching a standard-library disagreement is worth four cheap jobs.
  dsp-tests:
    name: DSP tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-latest
            cmake_extra: -DCMAKE_CXX_COMPILER=g++
          - name: Linux / Clang
            os: ubuntu-latest
            cmake_extra: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows / MSVC
            os: windows-latest
            cmake_extra: ""
          - name: macOS / Apple Clang
            os: macos-latest
            cmake_extra: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DFBK_BUILD_PLUGIN=OFF
          -DFBK_BUILD_TESTS=ON
          ${{ matrix.cmake_extra }}

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Run tests
        shell: bash
        run: |
          if [ -f build/tests/fbk_tests.exe ]; then
            ./build/tests/fbk_tests.exe
          else
            ./build/tests/fbk_tests
          fi

  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: dsp-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VST3 + Standalone)
            os: windows-latest
            artifact: FBKSuppressor-Windows
            cmake_extra: ""
          - name: macOS (VST3 + AU + Standalone, universal)
            os: macos-latest
            artifact: FBKSuppressor-macOS
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"'
          - name: Linux (VST3 + Standalone)
            os: ubuntu-latest
            artifact: FBKSuppressor-Linux
            cmake_extra: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libasound2-dev libjack-jackd2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # JUCE is a large shallow clone. Caching it keyed on the tag turns a
      # multi-minute fetch into a few seconds on every run after the first.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ env.JUCE_TAG }}-v1

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DFBK_BUILD_PLUGIN=ON
          -DFBK_BUILD_TESTS=ON
          -DFBK_JUCE_TAG=${{ env.JUCE_TAG }}
          ${{ matrix.cmake_extra }}

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Run DSP tests on this platform
        shell: bash
        run: |
          # Catch anything that is platform specific - a different float
          # evaluation order, a different denormal mode - rather than trusting
          # that Linux passing means Windows and macOS pass.
          if [ -f build/tests/fbk_tests ]; then
            ./build/tests/fbk_tests
          elif [ -f build/tests/fbk_tests.exe ]; then
            ./build/tests/fbk_tests.exe
          else
            echo "test binary not found" && exit 1
          fi

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          root="build/src/plugin/FBKSuppressor_artefacts/${BUILD_TYPE}"
          if [ ! -d "$root" ]; then
            root="build/src/plugin/FBKSuppressor_artefacts"
          fi
          echo "Collecting from $root"
          find "$root" -maxdepth 2 -mindepth 1 \
            \( -name '*.vst3' -o -name '*.component' -o -name 'FBKSuppressor' \
               -o -name 'FBKSuppressor.exe' -o -name 'FBKSuppressor.app' \) \
            -exec cp -R {} staging/ \;
          ls -laR staging

      - name: Remove macOS quarantine attributes
        if: runner.os == 'macOS'
        run: xattr -cr staging || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Host-compatibility validation, kept in a separate job on purpose: a problem
  # fetching or running pluginval must never stop the builds above from producing
  # something downloadable.
  validate:
    name: pluginval (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: FBKSuppressor-Linux
            asset: pluginval_Linux.zip
          - os: windows-latest
            artifact: FBKSuppressor-Windows
            asset: pluginval_Windows.zip
          - os: macos-latest
            artifact: FBKSuppressor-macOS
            asset: pluginval_macOS.zip

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: plugin

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libfreetype6 libfontconfig1 \
            libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 xvfb

      - name: Fetch pluginval
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.asset }}"
          unzip -q pluginval.zip -d pluginval

      # Strictness 5 is the level that exercises parameter handling, state
      # save/restore and, importantly here, repeated prepareToPlay calls at
      # varying block sizes and sample rates - which is exactly the behaviour a
      # zero-latency processor has to get right.
      - name: Validate VST3 (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x pluginval/pluginval
          xvfb-run -a ./pluginval/pluginval \
            --strictness-level 5 --validate-in-process --timeout-ms 300000 \
            --validate plugin/FBKSuppressor.vst3

      - name: Validate VST3 (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x pluginval/pluginval.app/Contents/MacOS/pluginval
          ./pluginval/pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 5 --validate-in-process --timeout-ms 300000 \
            --validate plugin/FBKSuppressor.vst3

      - name: Validate VST3 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./pluginval/pluginval.exe \
            --strictness-level 5 --validate-in-process --timeout-ms 300000 \
            --validate plugin/FBKSuppressor.vst3

  # ---------------------------------------------------------------------------
  # Publishing. Gated on both the builds and the validation: an unvalidated
  # binary has no business being a release, and the artifacts remain downloadable
  # from the run itself even when this job declines to publish.
  publish:
    name: Publish ${{ github.ref_name == 'main' && 'release' || 'pre-release' }}
    needs: [build, validate]
    # workflow_dispatch is allowed as well as push, purely as a recovery path.
    # Publishing depends on the validate jobs, and a run can stall between those
    # finishing and the dependent job being scheduled - which happened once, leaving
    # ten green jobs, no publish job, and a run wedged in_progress with no way to
    # finish it. Gated on push alone there was no way to publish that commit short of
    # inventing a new one. Manual dispatch on dev or main now does the same thing,
    # which also makes it possible to cut a release on demand.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history and tags, so the changelog can be generated against the
      # previous release rather than guessed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Work out the version and tag
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(sed -n 's/^project(FBKSuppressor[[:space:]]\+VERSION[[:space:]]\+\([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from CMakeLists.txt"
            exit 1
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            tag="v${version}"
            title="FBKSuppressor ${tag}"
            prerelease=false

            # Refuse to clobber an existing release. Publishing twice over the same
            # tag would silently replace binaries someone may already have
            # downloaded, so this is a hard stop with an actionable message.
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release $tag already exists. Bump the version in CMakeLists.txt before merging to main."
              exit 1
            fi
          else
            # Pre-release tags carry the run number, so every push to dev produces a
            # distinct, ordered tag without anyone having to bump anything.
            tag="v${version}-dev.${{ github.run_number }}"
            title="FBKSuppressor ${tag} (pre-release)"
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag (prerelease=$prerelease)"

      - name: Package each platform
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          mkdir -p dist

          shopt -s nullglob
          found=0
          for dir in artifacts/FBKSuppressor-*; do
            [ -d "$dir" ] || continue
            platform="${dir##*/FBKSuppressor-}"
            # -y preserves symlinks, which macOS .vst3 and .component bundles rely
            # on; without it the bundles arrive subtly broken.
            ( cd "$dir" && zip -q -r -y "../../dist/FBKSuppressor-${version}-${platform}.zip" . )
            found=$((found + 1))
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No build artifacts were found to publish"
            exit 1
          fi

          ( cd dist && sha256sum *.zip > SHA256SUMS.txt )
          ls -la dist

      - name: Compose release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Compare against the previous release of the same kind: a full release
          # against the last full release, a pre-release against whatever came last.
          if [ "${{ github.ref_name }}" = "main" ]; then
            previous=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease == false)] | sort_by(.createdAt) | last | .tagName // ""' || echo "")
          else
            previous=$(gh release list --limit 100 --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | last | .tagName // ""' || echo "")
          fi

          {
            if [ "${{ github.ref_name }}" = "dev" ]; then
              echo "Automated pre-release from \`dev\`. Built and validated, but not a stable release."
              echo
            fi

            echo "Commit \`${GITHUB_SHA:0:8}\`. All builds passed the DSP suite on their own"
            echo "platform, and every VST3 passed pluginval at strictness level 5."
            echo

            echo "## Downloads"
            echo
            echo "| File | Contains |"
            echo "|---|---|"
            for f in dist/FBKSuppressor-*-Windows.zip;  do [ -e "$f" ] && echo "| \`$(basename "$f")\` | VST3 + standalone |"; done
            for f in dist/FBKSuppressor-*-macOS.zip;    do [ -e "$f" ] && echo "| \`$(basename "$f")\` | VST3 + AU + standalone, universal |"; done
            for f in dist/FBKSuppressor-*-Linux.zip;    do [ -e "$f" ] && echo "| \`$(basename "$f")\` | VST3 + standalone |"; done
            echo "| \`SHA256SUMS.txt\` | Checksums |"
            echo

            echo "## Installing"
            echo
            echo "**Windows** - copy \`FBKSuppressor.vst3\` to \`C:\\Program Files\\Common Files\\VST3\\\`."
            echo
            echo "**macOS** - copy \`FBKSuppressor.vst3\` to \`/Library/Audio/Plug-Ins/VST3/\` and"
            echo "\`FBKSuppressor.component\` to \`/Library/Audio/Plug-Ins/Components/\`. These builds are"
            echo "**not code-signed or notarised**, so Gatekeeper will block them until you clear the"
            echo "quarantine flag:"
            echo
            echo '```sh'
            echo "xattr -dr com.apple.quarantine /Library/Audio/Plug-Ins/VST3/FBKSuppressor.vst3"
            echo "xattr -dr com.apple.quarantine /Library/Audio/Plug-Ins/Components/FBKSuppressor.component"
            echo '```'
            echo
            echo "**Standalone** - run it directly. Lowest achievable round trip, since there is no host"
            echo "buffering in the path."
            echo

            echo "## First checks"
            echo
            echo "Set **Strength** to 0% and null against the dry signal: it must cancel to digital"
            echo "silence. That verifies the host is compensating honestly before you trust anything"
            echo "else. See \`docs/VERIFYING.md\` for the rest, and calibrate against your most"
            echo "difficult voice - a high, steady one is the worst case for false positives, not a"
            echo "loud one."
            echo

            echo "## Changes"
            echo
            if [ -n "$previous" ] && git rev-parse -q --verify "refs/tags/$previous" >/dev/null; then
              echo "Since \`$previous\`:"
              echo
              git log --no-merges --pretty=format:'- %s' -n 60 "refs/tags/${previous}..HEAD"
              echo
            else
              echo "Recent commits:"
              echo
              git log --no-merges --pretty=format:'- %s' -20
              echo
            fi
          } > release-notes.md

          echo "Composed notes:"
          cat release-notes.md

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            "${{ steps.meta.outputs.tag }}"
            --target "${{ github.sha }}"
            --title "${{ steps.meta.outputs.title }}"
            --notes-file release-notes.md
          )
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" dist/*

          echo "### Published [${{ steps.meta.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }})" >> "$GITHUB_STEP_SUMMARY"
